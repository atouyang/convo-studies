<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Study — Questionnaire</title>
  <link rel="stylesheet" href="style.css">
  <script src="router.js?v=20261022-fix1"></script>
  <style>
    .item { padding:24px 0; border-bottom:1px solid var(--border); }
    .item-text { font-size:18px; font-weight:600; margin-bottom:14px; }
    .scale { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
    .choice { display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; padding:10px 5px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; }
    .choice input { width:18px; height:18px; }
    #submit { margin-top:30px; }
    .debug-controls { margin:20px 0; padding:14px; background:var(--soft); border:1px solid var(--border); }
    @media (max-width:700px) {
      .scale { grid-template-columns:1fr; }
      .choice { flex-direction:row; justify-content:flex-start; text-align:left; }
    }
  </style>
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p id="instructions"></p>

  <div id="debugControls" class="debug-controls hidden">
    <strong>Debug:</strong>
    <button id="fillNeutral" type="button">Fill all with Neutral</button>
  </div>

  <form id="questionnaire"></form>
  <button id="submit" type="button">Submit responses</button>
  <div id="error" class="error hidden"></div>
</main>

<script>
(async function () {
  if (routeIfCurrentStageSkipped(3)) return;

  const { conversationId, targetId, debug } = getStudyParams();
  const form = document.getElementById("questionnaire");
  const submitButton = document.getElementById("submit");
  const errorBox = document.getElementById("error");

  function fail(message) {
    errorBox.classList.remove("hidden");
    errorBox.textContent = message;
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  try {
    const [configResponse, questionnaireResponse, convoResponse] = await Promise.all([
      fetch("config.json"),
      fetch("data/questionnaire.json"),
      loadConversationData(conversationId)
    ]);

    if (!configResponse.ok || !questionnaireResponse.ok) {
      throw new Error("Could not load questionnaire data.");
    }

    const config = await configResponse.json();
    const questionnaire = await questionnaireResponse.json();
    const conversation = convoResponse;

    const speakerLabels = {};
    conversation.speakers.forEach((speaker, index) => {
      speakerLabels[speaker] = `Person ${String.fromCharCode(65 + index)}`;
    });
    const targetLabel = speakerLabels[targetId] || "the target person";

    document.getElementById("title").textContent = questionnaire.title;
    document.getElementById("instructions").textContent =
      questionnaire.instructions.replace("{target_label}", targetLabel);

    form.innerHTML = questionnaire.items.map(item => `
      <div class="item" data-item-id="${item.item_id}">
        <div class="item-text">${item.item_id}. ${escapeHtml(item.item_text)}</div>
        <div class="scale">
          ${questionnaire.scale.map(option => `
            <label class="choice">
              <input type="radio" name="item_${item.item_id}" value="${option.value}">
              <span>${escapeHtml(option.label)}</span>
            </label>
          `).join("")}
        </div>
      </div>
    `).join("");

    const session = JSON.parse(localStorage.getItem("conversationStudySession") || "{}");
    if (!session.participant_id) {
      session.participant_id =
        new URLSearchParams(window.location.search).get("participant_id") ||
        crypto.randomUUID();
    }
    session.conversation_id = conversationId;
    session.target_id = targetId;
    session.target_label = targetLabel;
    session.speaker_labels = speakerLabels;
    session.debug_mode = debug;
    session.study_started_at = session.study_started_at || new Date().toISOString();
    session.stage3_started_at = new Date().toISOString();
    localStorage.setItem("conversationStudySession", JSON.stringify(session));

    if (debug) document.getElementById("debugControls").classList.remove("hidden");

    document.getElementById("fillNeutral").addEventListener("click", function () {
      if (!debug) return;
      questionnaire.items.forEach(item => {
        const neutral = form.querySelector(`input[name="item_${item.item_id}"][value="3"]`);
        if (neutral) neutral.checked = true;
      });
    });

    function collectResponses() {
      const responses = [];
      for (const item of questionnaire.items) {
        const checked = form.querySelector(`input[name="item_${item.item_id}"]:checked`);
        if (!checked) return { ok:false, missingItem:item.item_id };

        responses.push({
          item_id: item.item_id,
          item_text: item.item_text,
          trait: item.trait,
          reverse_scored: item.reverse_scored,
          response: Number(checked.value)
        });
      }
      return { ok:true, responses };
    }

    function downloadJson(payload) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `conversation_study_${payload.participant_id}_${payload.conversation_id}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    submitButton.addEventListener("click", async function () {
      const result = collectResponses();

      if (!result.ok) {
        const missing = form.querySelector(`[data-item-id="${result.missingItem}"]`);
        missing.scrollIntoView({ behavior:"smooth", block:"center" });
        fail(`Please answer item ${result.missingItem} before submitting.`);
        return;
      }

      const finalSession = JSON.parse(localStorage.getItem("conversationStudySession") || "{}");
      finalSession.stage3_completed_at = new Date().toISOString();
      finalSession.study_completed_at = new Date().toISOString();
      finalSession.questionnaire_responses = result.responses;
      localStorage.setItem("conversationStudySession", JSON.stringify(finalSession));

      const payload = {
        participant_id: finalSession.participant_id,
        conversation_id: conversationId,
        target_id: targetId,
        target_label: targetLabel,
        debug_mode: debug,
        speaker_labels: speakerLabels,
        study_started_at: finalSession.study_started_at,
        study_completed_at: finalSession.study_completed_at,
        transcript_timing: finalSession.transcript_timing || [],
        questionnaire_responses: result.responses
      };

      if (config.submit_endpoint) {
        const response = await fetch(config.submit_endpoint, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(payload)
        });
        if (!response.ok) {
          fail("The server did not accept the response.");
          return;
        }
      } else {
        downloadJson(payload);
      }

      goToNextStage(3);
    });
  } catch (error) {
    fail(error.message);
  }
})();
</script>
</body>
</html>
