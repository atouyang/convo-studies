<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Study — Transcript</title>
  
<style>
  :root {
    --max-width: 900px;
    --border: #d9d9d9;
    --muted: #666;
    --bg-soft: #f7f7f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.5;
    background: white;
    color: #111;
  }

  main {
    width: min(var(--max-width), calc(100% - 40px));
    margin: 0 auto;
    padding: 56px 0 72px;
  }

  h1 {
    font-size: 30px;
    margin: 0 0 24px;
  }

  p {
    font-size: 18px;
  }

  .muted {
    color: var(--muted);
  }

  .continue {
    margin-top: 36px;
    font-weight: 700;
  }

  .error {
    border: 1px solid #b00020;
    padding: 16px;
    margin-top: 20px;
  }

  button {
    font: inherit;
    padding: 12px 20px;
    cursor: pointer;
  }
</style>

  <style>
    .topline {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: baseline;
      margin-bottom: 28px;
    }

    #progress {
      font-size: 15px;
      color: var(--muted);
      white-space: nowrap;
    }

    #turnContainer {
      display: grid;
      gap: 18px;
      min-height: 280px;
    }

    .utterance {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 22px;
    }

    .speaker {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .text {
      font-size: 20px;
      white-space: pre-wrap;
    }

    .instruction {
      text-align: center;
      margin-top: 32px;
      font-size: 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
<main>
  <div class="topline">
    <h1>Conversation Transcript</h1>
    <div id="progress"></div>
  </div>

  <div id="turnContainer"></div>
  <p class="instruction">Press ENTER to continue.</p>
  <div id="error" class="error" hidden></div>
</main>

<script>
(async function () {
  const container = document.getElementById("turnContainer");
  const progress = document.getElementById("progress");
  const errorBox = document.getElementById("error");

  function fail(message) {
    errorBox.hidden = false;
    errorBox.textContent = message;
  }

  try {
    const [configResponse, transcriptResponse] = await Promise.all([
      fetch("config.json"),
      fetch("stage2_transcript.json")
    ]);

    if (!configResponse.ok || !transcriptResponse.ok) {
      throw new Error("Could not load the transcript JSON.");
    }

    const config = await configResponse.json();
    const transcript = await transcriptResponse.json();

    const rowsPerScreen = config.rows_per_transcript_screen || 2;
    const screens = [];

    for (let i = 0; i < transcript.turns.length; i += rowsPerScreen) {
      screens.push(transcript.turns.slice(i, i + rowsPerScreen));
    }

    let currentIndex = 0;
    let currentShownAt = null;
    const timing = [];

    const session = JSON.parse(
      localStorage.getItem("conversationStudySession") || "{}"
    );
    if (!session.stage2_started_at) {
      session.stage2_started_at = new Date().toISOString();
      localStorage.setItem("conversationStudySession", JSON.stringify(session));
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      const rows = screens[currentIndex];

      container.innerHTML = rows.map(row => `
        <div class="utterance">
          <div class="speaker">${escapeHtml(row.speaker)}</div>
          <div class="text">${escapeHtml(row.utterance)}</div>
        </div>
      `).join("");

      progress.textContent =
        `Section ${currentIndex + 1} of ${screens.length}`;

      currentShownAt = performance.now();
    }

    render();

    document.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.repeat) return;

      const advancedAt = performance.now();

      timing.push({
        section_index: currentIndex,
        turn_ids: screens[currentIndex].map(row => row.turn_id),
        viewing_time_ms: Math.round(advancedAt - currentShownAt)
      });

      currentIndex += 1;

      if (currentIndex >= screens.length) {
        const updatedSession = JSON.parse(
          localStorage.getItem("conversationStudySession") || "{}"
        );
        updatedSession.stage2_completed_at = new Date().toISOString();
        updatedSession.transcript_timing = timing;
        localStorage.setItem(
          "conversationStudySession",
          JSON.stringify(updatedSession)
        );

        window.location.href =
          `stage3_questionnaire.html${window.location.search}`;
        return;
      }

      render();
    });
  } catch (error) {
    fail(
      error.message +
      " Serve this folder through a web server rather than opening the HTML with file://."
    );
  }
})();
</script>
</body>
</html>
