<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Study — Questionnaire</title>
  
<style>
  :root {
    --max-width: 900px;
    --border: #d9d9d9;
    --muted: #666;
    --bg-soft: #f7f7f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.5;
    background: white;
    color: #111;
  }

  main {
    width: min(var(--max-width), calc(100% - 40px));
    margin: 0 auto;
    padding: 56px 0 72px;
  }

  h1 {
    font-size: 30px;
    margin: 0 0 24px;
  }

  p {
    font-size: 18px;
  }

  .muted {
    color: var(--muted);
  }

  .continue {
    margin-top: 36px;
    font-weight: 700;
  }

  .error {
    border: 1px solid #b00020;
    padding: 16px;
    margin-top: 20px;
  }

  button {
    font: inherit;
    padding: 12px 20px;
    cursor: pointer;
  }
</style>

  <style>
    .item {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .item-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .choice input {
      width: 18px;
      height: 18px;
    }

    #submit {
      margin-top: 32px;
    }

    #status {
      margin-top: 18px;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .scale {
        grid-template-columns: 1fr;
      }
      .choice {
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
      }
    }
  </style>
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p id="instructions"></p>

  <form id="questionnaire"></form>
  <button id="submit" type="button">Submit responses</button>
  <div id="status"></div>
  <div id="error" class="error" hidden></div>
</main>

<script>
(async function () {
  const form = document.getElementById("questionnaire");
  const submitButton = document.getElementById("submit");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  function fail(message) {
    errorBox.hidden = false;
    errorBox.textContent = message;
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  try {
    const [configResponse, questionnaireResponse] = await Promise.all([
      fetch("config.json"),
      fetch("stage3_questionnaire.json")
    ]);

    if (!configResponse.ok || !questionnaireResponse.ok) {
      throw new Error("Could not load the questionnaire JSON.");
    }

    const config = await configResponse.json();
    const questionnaire = await questionnaireResponse.json();

    document.getElementById("title").textContent = questionnaire.title;
    document.getElementById("instructions").textContent =
      questionnaire.instructions.replace("{rated_person}", config.rated_person);

    form.innerHTML = questionnaire.items.map(item => `
      <div class="item" data-item-id="${item.item_id}">
        <div class="item-text">
          ${item.item_id}. ${escapeHtml(item.item_text)}
        </div>
        <div class="scale">
          ${questionnaire.scale.map(option => `
            <label class="choice">
              <input
                type="radio"
                name="item_${item.item_id}"
                value="${option.value}"
              >
              <span>${escapeHtml(option.label)}</span>
            </label>
          `).join("")}
        </div>
      </div>
    `).join("");

    const session = JSON.parse(
      localStorage.getItem("conversationStudySession") || "{}"
    );
    if (!session.stage3_started_at) {
      session.stage3_started_at = new Date().toISOString();
      localStorage.setItem("conversationStudySession", JSON.stringify(session));
    }

    function collectResponses() {
      const responses = [];

      for (const item of questionnaire.items) {
        const checked = form.querySelector(
          `input[name="item_${item.item_id}"]:checked`
        );

        if (!checked) {
          return {
            ok: false,
            missingItem: item.item_id
          };
        }

        responses.push({
          item_id: item.item_id,
          item_text: item.item_text,
          trait: item.trait,
          reverse_scored: item.reverse_scored,
          response: Number(checked.value)
        });
      }

      return { ok: true, responses };
    }

    function downloadJson(payload) {
      const blob = new Blob(
        [JSON.stringify(payload, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download =
        `conversation_study_${payload.participant_id}_${payload.conversation_id}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    submitButton.addEventListener("click", async function () {
      status.textContent = "";
      errorBox.hidden = true;

      const result = collectResponses();

      if (!result.ok) {
        const missing = form.querySelector(
          `[data-item-id="${result.missingItem}"]`
        );
        missing.scrollIntoView({ behavior: "smooth", block: "center" });
        fail(`Please answer item ${result.missingItem} before submitting.`);
        return;
      }

      submitButton.disabled = true;

      const finalSession = JSON.parse(
        localStorage.getItem("conversationStudySession") || "{}"
      );

      finalSession.stage3_completed_at = new Date().toISOString();
      finalSession.study_completed_at = new Date().toISOString();
      finalSession.questionnaire_responses = result.responses;

      localStorage.setItem(
        "conversationStudySession",
        JSON.stringify(finalSession)
      );

      const payload = {
        participant_id: finalSession.participant_id,
        experiment_name: config.experiment_name,
        conversation_id: config.conversation_id,
        rated_person: config.rated_person,
        study_started_at: finalSession.study_started_at,
        study_completed_at: finalSession.study_completed_at,
        transcript_timing: finalSession.transcript_timing || [],
        questionnaire_responses: result.responses
      };

      try {
        if (config.submit_endpoint) {
          const response = await fetch(config.submit_endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error("The server did not accept the response.");
          }

          status.textContent = "Responses submitted.";

          if (config.completion_url) {
            window.location.href = config.completion_url;
          }
        } else {
          downloadJson(payload);
          status.textContent =
            "Responses saved as a JSON file. This download behavior is intended for local testing.";
        }
      } catch (error) {
        submitButton.disabled = false;
        fail(error.message);
      }
    });
  } catch (error) {
    fail(
      error.message +
      " Serve this folder through a web server rather than opening the HTML with file://."
    );
  }
})();
</script>
</body>
</html>
